services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insurance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insurance"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/insurance
      ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/insurance
      REDIS_URL: redis://redis:6379/0
      DRAMATIQ_REDIS_URL: redis://redis:6379/2
      SESSION_TTL_SECONDS: "604800"
      SESSION_COOKIE_SECURE: "false"
      LOG_LEVEL: info
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: insurance-docs
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: openai/gpt-4o-mini
      OPENROUTER_TLS_SECLEVEL: "1"
      EMAIL_BACKEND: smtp
      EMAIL_FROM: noreply@localhost
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      APP_PUBLIC_URL: http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
    command: dramatiq app.queue.actors --processes 1 --threads 2
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/insurance
      ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/insurance
      REDIS_URL: redis://redis:6379/0
      DRAMATIQ_REDIS_URL: redis://redis:6379/2
      SESSION_TTL_SECONDS: "604800"
      SESSION_COOKIE_SECURE: "false"
      LOG_LEVEL: info
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: insurance-docs
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: openai/gpt-4o-mini
      OPENROUTER_TLS_SECLEVEL: "1"
      EMAIL_BACKEND: smtp
      EMAIL_FROM: noreply@localhost
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      APP_PUBLIC_URL: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          i=$$((i + 1))
          if [ "$$i" -gt 30 ]; then
            exit 1
          fi
          sleep 1
        done
        mc mb --ignore-existing local/insurance-docs

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  minio_data:
